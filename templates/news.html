{% extends "_layout.html" %}{% block content %}<header class="page-header"><div><h1>Malaysia Company News</h1></div></header><section class="panel"><h2>Malaysian News Sources</h2><div class="news-list">{% for item in articles %}<a href="{{ item.url }}" target="_blank" rel="noreferrer"><strong>{{ item.title }}</strong><span>{{ item.source }} - {{ item.published_at }}</span></a>{% else %}<p>No current Malaysian company news is available for this symbol.</p>{% endfor %}</div></section>{% endblock %}
